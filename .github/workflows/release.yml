name: Publish Release Assets

# 发布 Release 后自动构建并上传桌面包与 Android APK；也可手动指定 tag。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload assets for
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-assets-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Resolve release tag
        id: meta
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TAG:-}" ]; then
            echo "::error::Release tag is empty"
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.meta.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      # 标签必须与 Cargo.toml 的版本一致（可带 v 前缀），防止把旧版本产物挂到新 Release。
      - name: Validate tag and version
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as handle:
              data = tomllib.load(handle)
          print(data["package"]["version"])
          PY
          )"
          if [ "$RELEASE_TAG" != "$version" ] && [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match Cargo.toml version $version (expected $version or v$version)"
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # 手动触发时也要确认目标 Release 已创建且已发布，否则后面的上传必然失败。
      - name: Check release state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if ! draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            echo "::error::Release $RELEASE_TAG does not exist"
            exit 1
          fi
          if [ "$draft" != "false" ]; then
            echo "::error::Release $RELEASE_TAG is a draft; publish it before building assets"
            exit 1
          fi

  desktop:
    name: Desktop packages
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      source-ref: ${{ needs.prepare.outputs.sha }}

  android:
    name: Android APK
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/android.yml
    with:
      source-ref: ${{ needs.prepare.outputs.sha }}
    secrets: inherit

  upload:
    name: Upload assets
    needs: [prepare, desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: ppr-render-*
          path: release-assets
          merge-multiple: true

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-assets/*.zip release-assets/*.apk)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No packages were downloaded"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
