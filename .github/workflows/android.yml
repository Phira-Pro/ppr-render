name: Build Android APK

# 可单独手动构建，也可由 Release 工作流调用；日常 push 不触发。
on:
  workflow_dispatch:
    inputs:
      source-ref:
        description: ppr-render commit, tag or branch to build; empty uses the selected ref
        required: false
        type: string
        default: ''
      phira-pro-ref:
        description: Phira-Pro commit, tag or branch for the prpr dependency; empty uses .github/phira-pro-ref
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      source-ref:
        description: ppr-render commit, tag or branch to build; empty uses the caller SHA
        required: false
        type: string
        default: ''
      phira-pro-ref:
        description: Phira-Pro commit, tag or branch for the prpr dependency; empty uses .github/phira-pro-ref
        required: false
        type: string
        default: ''
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  apk:
    name: Release APK (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out ppr-render
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          path: ppr-render

      - name: Resolve Phira-Pro revision
        id: phira
        shell: bash
        env:
          INPUT_REF: ${{ inputs.phira-pro-ref }}
        run: |
          set -euo pipefail
          ref="${INPUT_REF:-}"
          if [ -z "$ref" ]; then
            ref="$(tr -d '[:space:]' < ppr-render/.github/phira-pro-ref)"
          fi
          if [ -z "$ref" ]; then
            echo "::error::Phira-Pro revision is empty; set .github/phira-pro-ref or the phira-pro-ref input"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out Phira-Pro
        uses: actions/checkout@v7.0.1
        with:
          repository: Phira-Pro/Phira-Pro
          ref: ${{ steps.phira.outputs.ref }}
          path: Phira-Pro
          fetch-depth: 1

      - name: Record Phira-Pro commit
        id: phira-commit
        shell: bash
        run: echo "sha=$(git -C Phira-Pro rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # 仓库没有 Gradle wrapper；固定 8.14.4 以匹配 AGP 8.9.2，并让 build.py 的
      # shutil.which("gradle") 直接找到这个版本，而不是 runner 自带的旧版。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      # runner 预装了 Android SDK / cmdline-tools，这里只用它的 sdkmanager 补齐
      # 需要的 platform / build-tools / NDK，避免依赖第三方 setup action。
      - name: Install Android SDK components
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="$(command -v sdkmanager)"; fi
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;27.2.12479018"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install FFmpeg build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make pkg-config bzip2 xz-utils

      # rust-toolchain.toml 锁定了 nightly-2026-01-01；cargo-ndk 用默认工具链安装。
      - name: Set up Rust
        working-directory: ppr-render
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      # Rust 冷编译和 FFmpeg 源码编译很慢，缓存能省掉大部分时间。
      - name: Cache Android build
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ppr-render/target
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ppr-render-android-${{ runner.os }}-${{ hashFiles('ppr-render/build.py', 'ppr-render/Cargo.lock', 'ppr-render/rust-toolchain.toml', 'ppr-render/android/**/*.gradle', 'ppr-render/android/gradle.properties') }}-${{ steps.phira-commit.outputs.sha }}
          restore-keys: |
            ppr-render-android-${{ runner.os }}-

      # 签名密钥来自仓库 Secrets；脚本只在 runner 临时目录和 android/ 下生成
      # 构建时配置，构建结束后删除，不会进入仓库或构建产物。
      - name: Restore signing configuration
        working-directory: ppr-render
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python .github/scripts/configure_android_signing.py

      - name: Build release APK
        working-directory: ppr-render
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: python build.py android

      # 确认签名真的生效：如果密钥缺失，Gradle 会回退到 debug 证书，这一步让它显式失败。
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find ppr-render/dist -maxdepth 1 -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::没有找到构建出的 APK"
            exit 1
          fi
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "$SDK/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/apksigner.txt"; then
            echo "::error::APK 使用了调试证书，签名配置没有生效"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ppr-render-android-ARM64
          path: ppr-render/dist/*.apk
          compression-level: 0
          if-no-files-found: error

      - name: Remove signing configuration
        if: always()
        shell: bash
        run: rm -f ppr-render/android/keystore.properties
